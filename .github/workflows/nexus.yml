name: nexus

# Each run listens to Telegram for ~50 minutes, answers commands, saves its (encrypted) state to the "state"
# branch, then starts the next run itself (self-chaining), so the bot is offline only for the ~2-3 minutes of
# setup between runs. GitHub's cron is unreliable for new/low-activity repos, so it is only a backup that
# restarts the chain if it ever breaks. `concurrency` keeps exactly one run active at a time.
# To stop the bot: Actions tab -> nexus -> "..." -> Disable workflow.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: nexus
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # lets a run start the next one

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}          # free LLM for the research agent (any one of these three)
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GITHUB_TOKEN_FOR_STATE: ${{ secrets.GITHUB_TOKEN }}
      STATE_KEY: ${{ secrets.STATE_KEY }}
      NEXUS_DATA: ${{ github.workspace }}/state
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.fastembed
      NEXUS_RUN_MINUTES: "50"
      NEXUS_DRAIN_MINUTES: "8"
      NEXUS_FETCH_HOURS: "2"       # read all 123 sources every 2 hours
      NEXUS_AGENT_HOURS: "3"       # research-agent cycle
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4

      - name: Fetch saved state branch (absent on first run)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: state
          path: statebranch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Cache the ML embedding model (downloaded once, reused by later runs)
        uses: actions/cache@v4
        with:
          path: .fastembed
          key: fastembed-${{ hashFiles('ml/models/domain_model.json') }}
          restore-keys: fastembed-

      - name: Check required secrets
        run: |
          for v in TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID STATE_KEY; do
            if [ -z "${!v}" ]; then echo "::error::Repository secret $v is missing or empty (Settings > Secrets and variables > Actions)"; exit 1; fi
          done

      - name: Decrypt state
        run: |
          mkdir -p state
          if [ -f statebranch/state.enc ]; then
            if openssl enc -d -aes-256-cbc -pbkdf2 -pass env:STATE_KEY -in statebranch/state.enc | tar xz -C state; then
              echo "state restored"
            else
              echo "::error::Could not decrypt state.enc - STATE_KEY differs from the key it was saved with. Fix the secret, or delete the 'state' branch to start fresh. Saved state is left untouched."
              exit 1
            fi
          else
            echo "no saved state yet"
          fi

      - name: Run NEXUS (listen, answer, work)
        id: nexus
        run: python cloud_bot.py

      - name: Save encrypted state
        # only when NEXUS actually ran (even if it then failed); never after a failed restore
        if: always() && steps.nexus.conclusion != 'skipped'
        run: |
          tar czf - -C state . | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:STATE_KEY -out /tmp/state.enc
          rm -rf /tmp/out && mkdir /tmp/out && cp /tmp/state.enc /tmp/out/state.enc && cd /tmp/out
          git init -q && git checkout -q -b state
          git config user.name "nexus-bot" && git config user.email "nexus-bot@users.noreply.github.com"
          git add state.enc && git commit -q -m "state $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN_FOR_STATE}@github.com/${GITHUB_REPOSITORY}.git" state

      - name: Start the next run
        # only after a clean run, so a broken setup cannot loop; the hourly cron restarts the chain otherwise
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run nexus.yml --ref "${GITHUB_REF_NAME}"
